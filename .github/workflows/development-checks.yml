name: Development checks
on:
  push:
    branches: [develop, 'feature/attachments-20mb']
  pull_request:
    branches: [main, develop]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - name: PHP syntax lint
        run: |
          set -eu
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Parser smoke test
        run: php Test/parser-smoke.php
      - name: JavaScript syntax check
        run: |
          set -eu
          find Asset/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
